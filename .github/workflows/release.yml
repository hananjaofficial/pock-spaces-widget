name: Build & Release Pock Widget
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Widget
        run: chmod +x build.sh && ./build.sh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Spaces.pock.zip
